<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Santiago — Quando é a festa</title>
<style>
  :root {
    --cream: #fbf9f4; --cream2: #f2ede0; --tan-light: #f7dd99; --tan: #eaa200;
    --brown: #eaa200; --blue: #2e86ab; --espresso: #332f28; --ink: #332f28;
    --ink-soft: #83796a; --card: #ffffff; --line: #ece5d4; --shadow: rgba(40, 35, 25, 0.13);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--cream); }
  body {
    color: var(--ink); font-family: "Work Sans", ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased; padding: 0 0 72px;
    display: flex; flex-direction: column; align-items: center; position: relative;
    background-image:
      linear-gradient(180deg, var(--cream) 0, var(--cream) 110px, rgba(251,249,244,.65) 220px, rgba(251,249,244,0) 380px),
      url("assets/bg.png");
    background-repeat: no-repeat, no-repeat;
    background-position: top center, top center;
    background-size: 100% 380px, 122vw auto;
  }
  .topbar {
    position: sticky; top: 0; z-index: 10; width: 100%; background: var(--brown); color: #fff;
    text-align: center; padding: 13px 16px; font-size: 17px; font-weight: 700;
    letter-spacing: 0.06em; text-transform: uppercase; font-variant-numeric: tabular-nums;
  }
  .topbar strong { font-weight: 700; }
  .back-link {
    display: inline-flex; align-items: center; gap: 6px;
    text-decoration: none; color: var(--brown); font-weight: 700;
    font-size: 18px; margin: 4px 0 16px;
  }
  .back-link:hover { text-decoration: underline; }

  .wrap { width: 100%; max-width: 560px; padding: 24px 20px 0; }
  .page-kicker {
    text-align: center; font-size: 13px; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--blue); margin: 22px 0 8px;
  }
  .page-title {
    font-family: "Fraunces", serif; font-weight: 640; font-size: clamp(26px, 7vw, 36px);
    text-align: center; color: var(--ink); margin: 0 0 8px; text-wrap: balance;
  }
  .page-lede { text-align: center; color: var(--ink-soft); font-size: 16.5px; max-width: 36ch; margin: 0 auto 30px; }

  .details {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 34px;
  }
  .details .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 20px;
    padding: 22px 12px; text-align: center; box-shadow: 0 14px 30px -20px var(--shadow);
  }
  .details .card svg { color: var(--brown); margin-bottom: 8px; }
  .details .card .label {
    font-size: 12.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-soft); margin-bottom: 5px;
  }
  .details .card .value {
    font-family: "Fraunces", serif; font-weight: 600; font-size: clamp(17px, 4.5vw, 20px); color: var(--ink);
  }

  .countdown-title {
    text-align: center; font-family: "Fraunces", serif; font-weight: 600; font-size: 18px;
    color: var(--ink); margin: 0 0 14px;
  }
  .countdown { display: flex; justify-content: center; gap: 14px; margin-bottom: 40px; }
  .countdown .cell {
    width: 70px; height: 70px; border-radius: 50%; background: var(--card);
    border: 1.5px solid var(--tan-light); display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }
  .countdown .num {
    font-family: "Fraunces", serif; font-weight: 620; font-size: 21px; color: var(--espresso);
    font-variant-numeric: tabular-nums; line-height: 1;
  }
  .countdown .unit { margin-top: 3px; font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-soft); }

  footer { text-align: center; font-size: 13.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-soft); }

  @media (max-width: 420px) {
    .countdown .cell { width: 58px; height: 58px; }
    .countdown { gap: 10px; }
  }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,380..700;1,9..144,380..700&family=Work+Sans:wght@400;500;600&display=swap">
</head>
<body>

<div class="topbar" id="topbar">carregando…</div>

<div class="wrap">
  <a class="back-link" href="index.html">← Início</a>
  <p class="page-kicker">guarda a data</p>
  <h1 class="page-title">Quando é a festa</h1>
  <p class="page-lede">Separa a agenda — vai ter brincadeira o dia inteiro!</p>

  <div class="details">
    <div class="card">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3" stroke="currentColor" stroke-width="1.8"/><line x1="3" y1="10" x2="21" y2="10" stroke="currentColor" stroke-width="1.8"/><line x1="7" y1="3" x2="7" y2="7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><line x1="17" y1="3" x2="17" y2="7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <div class="label">Data</div>
      <div class="value">28 de novembro</div>
    </div>
    <div class="card">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/><path d="M12 7v5l3.5 2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <div class="label">Horário</div>
      <div class="value">12h00</div>
    </div>
  </div>

  <p class="countdown-title">Faltam só...</p>
  <div class="countdown" id="countdown">
    <div class="cell"><div class="num" id="cd-d">–</div><div class="unit">dias</div></div>
    <div class="cell"><div class="num" id="cd-h">–</div><div class="unit">hrs</div></div>
    <div class="cell"><div class="num" id="cd-m">–</div><div class="unit">min</div></div>
    <div class="cell"><div class="num" id="cd-s">–</div><div class="unit">seg</div></div>
  </div>

  <footer>Vila Encantada 1 · Rio de Janeiro</footer>
</div>

<script>
  (function () {
    var target = new Date("2026-11-28T12:00:00-03:00").getTime();
    var bar = document.getElementById("topbar");
    var elD = document.getElementById("cd-d"), elH = document.getElementById("cd-h"),
        elM = document.getElementById("cd-m"), elS = document.getElementById("cd-s");
    function tick() {
      var diff = target - Date.now();
      if (diff <= 0) {
        bar.textContent = "É hoje! ✈️";
        elD.textContent = elH.textContent = elM.textContent = elS.textContent = "0";
        return;
      }
      var d = Math.floor(diff / 86400000), h = Math.floor((diff % 86400000) / 3600000),
          m = Math.floor((diff % 3600000) / 60000), s = Math.floor((diff % 60000) / 1000);
      bar.innerHTML = "Faltam <strong>" + d + "</strong>d · <strong>" + String(h).padStart(2,"0") + "</strong>h · <strong>" + String(m).padStart(2,"0") + "</strong>min · <strong>" + String(s).padStart(2,"0") + "</strong>s";
      elD.textContent = d; elH.textContent = String(h).padStart(2,"0");
      elM.textContent = String(m).padStart(2,"0"); elS.textContent = String(s).padStart(2,"0");
    }
    tick();
    setInterval(tick, 1000);
  })();
</script>
</body>
</html>
