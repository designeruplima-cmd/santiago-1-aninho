<title>Santiago — 1 Aninho</title>
<style>
  :root {
    --cream: #fbf9f4;
    --cream2: #f2ede0;
    --tan-light: #f7dd99;
    --tan: #eaa200;
    --brown: #eaa200;
    --blue: #2e86ab;
    --espresso: #332f28;
    --ink: #332f28;
    --ink-soft: #83796a;
    --card: #ffffff;
    --line: #ece5d4;
    --shadow: rgba(40, 35, 25, 0.13);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    background: var(--cream);
  }

  body {
    color: var(--ink);
    font-family: "Work Sans", ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: 0 0 72px;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    background-image: url("assets/bg.png");
    background-size: 100vw auto;
    background-position: top center;
    background-repeat: no-repeat;
  }

  .topbar {
    position: sticky;
    top: 0;
    z-index: 10;
    width: 100%;
    background: var(--brown);
    color: #fff;
    text-align: center;
    padding: 10px 16px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    font-variant-numeric: tabular-nums;
  }
  .topbar strong { font-weight: 700; }

  .sheet {
    width: 100%;
    max-width: 600px;
    position: relative;
    padding: clamp(20px, 6vw, 36px) 16px 0;
  }

  /* ---------- nav grid ---------- */
  .nav-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin: 6px 0 20px;
  }
  .nav-tile {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    text-align: center;
    text-decoration: none;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 22px 12px;
    box-shadow: 0 14px 30px -20px var(--shadow);
    color: var(--ink);
  }
  .nav-tile svg { color: var(--brown); }
  .nav-tile span {
    font-family: "Fraunces", serif;
    font-weight: 600;
    font-size: 14.5px;
    line-height: 1.25;
  }
  .nav-tile.wide {
    grid-column: 1 / -1;
    flex-direction: row;
    padding: 18px 12px;
  }

  .hero-logo {
    display: block;
    width: min(360px, 78%);
    height: auto;
    margin: 0 auto;
  }

  .lede {
    position: relative;
    text-align: center;
    color: var(--ink-soft);
    font-size: 15px;
    max-width: 34ch;
    margin: 14px auto 34px;
  }

  footer {
    position: relative;
    text-align: center;
    margin-top: 34px;
    font-size: 11.5px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  @media (prefers-reduced-motion: no-preference) {
    .sheet > * { animation: fade 0.7s ease both; }
    .nav-grid { animation-delay: 0.12s; }
  }
  @keyframes fade { from { opacity: 0; transform: translateY(8px);} to { opacity: 1; transform: none; } }

  @media (max-width: 480px) {
    .sheet { padding-left: 22px; padding-right: 22px; }
    .hero-logo { width: min(260px, 72%); }
    .lede { font-size: 14px; max-width: 30ch; }
  }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,380..700;1,9..144,380..700&family=Work+Sans:wght@400;500;600&display=swap">

<div class="topbar" id="topbar">carregando contagem…</div>

<div class="sheet">
  <img class="hero-logo" src="assets/logo.png" alt="Santiago — 1 aninho">
  <p class="lede">Venha brincar com o Santiago no seu primeiro aninho!</p>

  <div class="nav-grid">
    <a class="nav-tile" href="quando.html">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3" stroke="currentColor" stroke-width="1.8"/><line x1="3" y1="10" x2="21" y2="10" stroke="currentColor" stroke-width="1.8"/><line x1="7" y1="3" x2="7" y2="7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><line x1="17" y1="3" x2="17" y2="7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span>Quando é a festa</span>
    </a>
    <a class="nav-tile" href="quem.html">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/><circle cx="9" cy="10" r="1" fill="currentColor"/><circle cx="15" cy="10" r="1" fill="currentColor"/><path d="M8.5 14.5c1 1.2 2.2 1.8 3.5 1.8s2.5-.6 3.5-1.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/></svg>
      <span>Minha história</span>
    </a>
    <a class="nav-tile" href="como-chegar.html">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 21s7-6.1 7-11.5A7 7 0 1 0 5 9.5C5 14.9 12 21 12 21Z" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="9.5" r="2.3" stroke="currentColor" stroke-width="1.8"/></svg>
      <span>Como chegar</span>
    </a>
    <a class="nav-tile" href="confirmar.html">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/><path d="M8 12.5l2.5 2.5L16 9.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
      <span>Confirmar presença</span>
    </a>
    <a class="nav-tile wide" href="presente.html">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="9" width="18" height="11" rx="1.5" stroke="currentColor" stroke-width="1.8"/><path d="M3 9h18M12 9v11M7.5 9a2.5 2.5 0 010-5C10 4 12 9 12 9c0 0 2-5 4.5-5a2.5 2.5 0 010 5" stroke="currentColor" stroke-width="1.8"/></svg>
      <span>Sugestão de presente</span>
    </a>
  </div>

  <footer>Vila Encantada 1 · Rio de Janeiro</footer>
</div>

<script>
  (function () {
    var target = new Date("2026-11-28T12:00:00-03:00").getTime();
    var bar = document.getElementById("topbar");
    function tick() {
      var diff = target - Date.now();
      if (diff <= 0) { bar.textContent = "É hoje! ✈️"; return; }
      var d = Math.floor(diff / 86400000);
      var h = Math.floor((diff % 86400000) / 3600000);
      var m = Math.floor((diff % 3600000) / 60000);
      var s = Math.floor((diff % 60000) / 1000);
      bar.innerHTML = "Faltam <strong>" + d + "</strong>d · <strong>" + String(h).padStart(2,"0") + "</strong>h · <strong>" + String(m).padStart(2,"0") + "</strong>min · <strong>" + String(s).padStart(2,"0") + "</strong>s";
    }
    tick();
    setInterval(tick, 1000);
  })();
</script>
