<head>
<meta charset="UTF-8">

<title>Santiago — 1 Aninho</title>
<style>
  :root {
    --cream: #fbf9f4;
    --cream2: #f2ede0;
    --tan-light: #f7dd99;
    --tan: #eaa200;
    --brown: #eaa200;
    --blue: #2e86ab;
    --espresso: #332f28;
    --ink: #332f28;
    --ink-soft: #83796a;
    --card: #ffffff;
    --line: #ece5d4;
    --shadow: rgba(40, 35, 25, 0.13);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    background: var(--cream);
  }

  body {
    color: var(--ink);
    font-family: "Work Sans", ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: 0 0 72px;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    background-image:
      linear-gradient(180deg, var(--cream) 0, var(--cream) 110px, rgba(251,249,244,.65) 220px, rgba(251,249,244,0) 380px),
      url("assets/bg.png");
    background-repeat: no-repeat, no-repeat;
    background-position: top center, top center;
    background-size: 100% 380px, 122vw auto;
  }

  .topbar {
    position: sticky;
    top: 0;
    z-index: 10;
    width: 100%;
    background: var(--brown);
    color: #fff;
    text-align: center;
    padding: 10px 16px;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    font-variant-numeric: tabular-nums;
  }
  .topbar strong { font-weight: 700; }

  .sheet {
    width: 100%;
    max-width: 600px;
    position: relative;
    padding: clamp(20px, 6vw, 36px) 16px 0;
  }

  /* ---------- nav grid ---------- */
  .nav-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 12px;
    margin: 6px 0 20px;
  }
  .nav-tile {
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: flex-start;
    gap: 14px;
    text-align: left;
    text-decoration: none;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 18px 20px;
    box-shadow: 0 14px 30px -20px var(--shadow);
    color: var(--ink);
  }
  .nav-tile:nth-child(even) { background: #f4f4f3; }
  .nav-tile svg { color: var(--brown); flex: none; }
  .nav-tile span {
    font-family: "Fraunces", serif;
    font-weight: 600;
    font-size: 16.5px;
    line-height: 1.25;
  }

  .hero-logo {
    display: block;
    width: min(360px, 78%);
    height: auto;
    margin: 0 auto;
  }

  /* ---------- photo carousel ---------- */
  .photo-carousel-title {
    text-align: center;
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--blue);
    margin: 8px 0 12px;
  }
  .photo-carousel {
    display: flex;
    gap: 12px;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    padding: 4px 4px 14px;
    margin: 0 0 6px;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .photo-carousel::-webkit-scrollbar { display: none; }
  .photo-carousel .frame {
    flex: 0 0 auto;
    scroll-snap-align: center;
    width: 66%;
    max-width: 260px;
    aspect-ratio: 4 / 5;
    border-radius: 20px;
    background: var(--cream2);
    border: 1px solid var(--line);
    box-shadow: 0 14px 30px -20px var(--shadow);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--tan);
    overflow: hidden;
  }
  .photo-carousel .frame img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .lede {
    position: relative;
    text-align: center;
    color: var(--ink-soft);
    font-size: 17px;
    max-width: 34ch;
    margin: 14px auto 34px;
  }

  footer {
    position: relative;
    text-align: center;
    margin-top: 34px;
    font-size: 13.5px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  @media (prefers-reduced-motion: no-preference) {
    .sheet > * { animation: fade 0.7s ease both; }
    .nav-grid { animation-delay: 0.12s; }
  }
  @keyframes fade { from { opacity: 0; transform: translateY(8px);} to { opacity: 1; transform: none; } }

  @media (max-width: 480px) {
    .sheet { padding-left: 22px; padding-right: 22px; }
    .hero-logo { width: min(260px, 72%); }
    .lede { font-size: 16px; max-width: 30ch; }
  }
</style>

<script>
  (function () {
    var target = new Date("2026-11-28T12:00:00-03:00").getTime();
    var bar = document.getElementById("topbar");
    function tick() {
      var diff = target - Date.now();
      if (diff <= 0) { bar.textContent = "É hoje! ✈️"; return; }
      var d = Math.floor(diff / 86400000);
      var h = Math.floor((diff % 86400000) / 3600000);
      var m = Math.floor((diff % 3600000) / 60000);
      var s = Math.floor((diff % 60000) / 1000);
      bar.innerHTML = "Faltam <strong>" + d + "</strong>d · <strong>" + String(h).padStart(2,"0") + "</strong>h · <strong>" + String(m).padStart(2,"0") + "</strong>min · <strong>" + String(s).padStart(2,"0") + "</strong>s";
    }
    tick();
    setInterval(tick, 1000);
  })();
</script>
