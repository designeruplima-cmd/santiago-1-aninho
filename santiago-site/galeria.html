<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Santiago — Galeria de Fotos</title>
<style>
  :root {
    --cream: #fbf9f4; --cream2: #f2ede0; --tan-light: #f7dd99; --tan: #eaa200;
    --brown: #eaa200; --blue: #2e86ab; --espresso: #332f28; --ink: #332f28;
    --ink-soft: #83796a; --card: #ffffff; --line: #ece5d4; --shadow: rgba(40, 35, 25, 0.13);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--cream); }
  body {
    color: var(--ink); font-family: "Work Sans", ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased; padding: 0 0 72px;
    display: flex; flex-direction: column; align-items: center; position: relative;
    background-image:
      linear-gradient(180deg, var(--cream) 0, var(--cream) 110px, rgba(251,249,244,.65) 220px, rgba(251,249,244,0) 380px),
      url("assets/bg.png");
    background-repeat: no-repeat, no-repeat;
    background-position: top center, top center;
    background-size: 100% 380px, 122vw auto;
  }
  .topbar {
    position: sticky; top: 0; z-index: 10; width: 100%; background: var(--brown); color: #fff;
    text-align: center; padding: 13px 16px; font-size: 17px; font-weight: 700;
    letter-spacing: 0.06em; text-transform: uppercase; font-variant-numeric: tabular-nums;
  }
  .topbar strong { font-weight: 700; }
  .back-link {
    display: inline-flex; align-items: center; gap: 6px;
    text-decoration: none; color: var(--brown); font-weight: 700;
    font-size: 18px; margin: 4px 0 16px;
  }
  .back-link:hover { text-decoration: underline; }

  .wrap { width: 100%; max-width: 560px; padding: 24px 20px 0; }
  .page-kicker {
    text-align: center; font-size: 13px; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--blue); margin: 22px 0 8px;
  }
  .page-title {
    font-family: "Fraunces", serif; font-weight: 640; font-size: clamp(26px, 7vw, 36px);
    text-align: center; color: var(--ink); margin: 0 0 8px; text-wrap: balance;
  }
  .page-lede { text-align: center; color: var(--ink-soft); font-size: 16.5px; max-width: 36ch; margin: 0 auto 26px; }

  .full-gallery { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 20px; }
  .full-gallery button {
    all: unset; aspect-ratio: 1; border-radius: 14px; background: var(--cream2);
    border: 1px solid var(--line); overflow: hidden; cursor: pointer; display: block;
  }
  .full-gallery img { width: 100%; height: 100%; object-fit: cover; display: block; }

  footer { text-align: center; font-size: 13.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-soft); }

  /* ---------- lightbox ---------- */
  .lightbox {
    position: fixed; inset: 0; z-index: 100; background: rgba(20, 16, 10, 0.92);
    display: none; align-items: center; justify-content: center; padding: 24px;
  }
  .lightbox.is-open { display: flex; }
  .lightbox img {
    max-width: 100%; max-height: 82vh; border-radius: 12px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .lightbox-close {
    position: absolute; top: 18px; right: 18px; width: 40px; height: 40px;
    border-radius: 50%; border: none; background: rgba(255,255,255,0.15); color: #fff;
    font-size: 22px; line-height: 1; cursor: pointer;
  }
  .lightbox-nav {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 44px; height: 44px; border-radius: 50%; border: none;
    background: rgba(255,255,255,0.15); color: #fff; font-size: 22px; cursor: pointer;
  }
  .lightbox-prev { left: 12px; }
  .lightbox-next { right: 12px; }
  .lightbox-count {
    position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%);
    color: rgba(255,255,255,0.85); font-size: 13px; letter-spacing: 0.06em;
  }
  @media (max-width: 420px) {
    .lightbox-nav { width: 38px; height: 38px; font-size: 18px; }
  }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,380..700;1,9..144,380..700&family=Work+Sans:wght@400;500;600&display=swap">
</head>
<body>

<div class="topbar" id="topbar">carregando…</div>

<div class="wrap">
  <a class="back-link" href="index.html">← Início</a>
  <p class="page-kicker">momentos</p>
  <h1 class="page-title">Galeria de fotos</h1>
  <p class="page-lede">Todos os cliques do meu primeiro aninho. Toca numa foto pra ver ela de pertinho.</p>

  <div class="full-gallery" id="fullGallery"></div>

  <footer>Vila Encantada 1 · Rio de Janeiro</footer>
</div>

<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lightboxClose" aria-label="Fechar">✕</button>
  <button class="lightbox-nav lightbox-prev" id="lightboxPrev" aria-label="Foto anterior">‹</button>
  <img id="lightboxImg" src="" alt="Santiago">
  <button class="lightbox-nav lightbox-next" id="lightboxNext" aria-label="Próxima foto">›</button>
  <div class="lightbox-count" id="lightboxCount"></div>
</div>

<script>
  (function () {
    var target = new Date("2026-11-28T12:00:00-03:00").getTime();
    var bar = document.getElementById("topbar");
    function tick() {
      var diff = target - Date.now();
      if (diff <= 0) { bar.textContent = "É hoje! ✈️"; return; }
      var d = Math.floor(diff / 86400000), h = Math.floor((diff % 86400000) / 3600000),
          m = Math.floor((diff % 3600000) / 60000), s = Math.floor((diff % 60000) / 1000);
      bar.innerHTML = "Faltam <strong>" + d + "</strong>d · <strong>" + String(h).padStart(2,"0") + "</strong>h · <strong>" + String(m).padStart(2,"0") + "</strong>min · <strong>" + String(s).padStart(2,"0") + "</strong>s";
    }
    tick();
    setInterval(tick, 1000);
  })();
</script>

<script>
  (function () {
    var TOTAL = 56;
    var photos = [];
    for (var i = 1; i <= TOTAL; i++) {
      photos.push("assets/fotos/santiago-" + String(i).padStart(2, "0") + ".jpg");
    }

    var grid = document.getElementById("fullGallery");
    photos.forEach(function (src, i) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.setAttribute("aria-label", "Ver foto " + (i + 1) + " ampliada");
      var img = document.createElement("img");
      img.src = src;
      img.alt = "Santiago";
      img.loading = "lazy";
      btn.appendChild(img);
      btn.addEventListener("click", function () { openLightbox(i); });
      grid.appendChild(btn);
    });

    var lightbox = document.getElementById("lightbox");
    var lightboxImg = document.getElementById("lightboxImg");
    var lightboxCount = document.getElementById("lightboxCount");
    var current = 0;

    function openLightbox(i) {
      current = i;
      render();
      lightbox.classList.add("is-open");
      document.body.style.overflow = "hidden";
    }
    function closeLightbox() {
      lightbox.classList.remove("is-open");
      document.body.style.overflow = "";
    }
    function render() {
      lightboxImg.src = photos[current];
      lightboxCount.textContent = (current + 1) + " / " + photos.length;
    }
    function next() { current = (current + 1) % photos.length; render(); }
    function prev() { current = (current - 1 + photos.length) % photos.length; render(); }

    document.getElementById("lightboxClose").addEventListener("click", closeLightbox);
    document.getElementById("lightboxNext").addEventListener("click", next);
    document.getElementById("lightboxPrev").addEventListener("click", prev);
    lightbox.addEventListener("click", function (e) {
      if (e.target === lightbox) closeLightbox();
    });
    document.addEventListener("keydown", function (e) {
      if (!lightbox.classList.contains("is-open")) return;
      if (e.key === "Escape") closeLightbox();
      if (e.key === "ArrowRight") next();
      if (e.key === "ArrowLeft") prev();
    });

    var touchStartX = 0, touchStartY = 0;
    lightbox.addEventListener("touchstart", function (e) {
      touchStartX = e.changedTouches[0].clientX;
      touchStartY = e.changedTouches[0].clientY;
    }, { passive: true });
    lightbox.addEventListener("touchend", function (e) {
      var dx = e.changedTouches[0].clientX - touchStartX;
      var dy = e.changedTouches[0].clientY - touchStartY;
      if (Math.abs(dx) < 40 || Math.abs(dx) < Math.abs(dy)) return;
      if (dx < 0) next(); else prev();
    }, { passive: true });
  })();
</script>
</body>
</html>
